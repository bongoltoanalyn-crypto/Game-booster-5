name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0"

      - name: Extract archives
        run: |
          sudo apt-get update -y && sudo apt-get install -y p7zip-full unzip
          for f in *.zip; do [ -e "$f" ] && unzip -o "$f"; done
          for f in *.7z; do [ -e "$f" ] && 7z x -y "$f"; done
          ls -R | head -80
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Gradle project
        id: locate
        run: |
          S=$(find . \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.github/*' | head -n 1)
          if [ -z "$S" ]; then
            echo "Walang settings.gradle. Laman ng repo:"
            find . -not -path './.git/*' | head -100
            exit 1
          fi
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
