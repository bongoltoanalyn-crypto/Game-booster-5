name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0"

      - name: Extract archives
        run: |
          sudo apt-get update -y && sudo apt-get install -y p7zip-full unzip
          for f in *.zip; do [ -e "$f" ] && unzip -o "$f"; done
          for f in *.7z; do [ -e "$f" ] && 7z x -y "$f"; done
          ls -R | head -80

      - name: Locate Gradle project
        id: locate
        run: |
          G=$(find . -name gradlew -not -path './.github/*' | head -n 1)
          if [ -z "$G" ]; then echo "gradlew not found"; exit 1; fi
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
